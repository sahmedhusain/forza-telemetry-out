<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="520" height="80">
  <defs>
    <linearGradient id="forzaPinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff0099" />
    </linearGradient>
    <linearGradient id="apexCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ce" />
    </linearGradient>
    <linearGradient id="neonLimeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8ff00" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Speed slash angles -->
  <g transform="skewX(-14)">
    <!-- Racing Speed Bars -->
    <rect x="20" y="16" width="10" height="48" rx="2" fill="url(#forzaPinkGrad)" />
    <rect x="36" y="24" width="8" height="40" rx="2" fill="url(#neonLimeGrad)" />
    <rect x="48" y="32" width="6" height="32" rx="2" fill="url(#apexCyanGrad)" />

    <!-- FORZA text -->
    <text x="68" y="54" font-family="'Arial Black', 'Impact', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">
      FORZA
    </text>

    <!-- TELEMETRY OUT text -->
    <text x="242" y="54" font-family="'Arial Black', 'Impact', sans-serif" font-size="44" font-weight="900" fill="url(#forzaPinkGrad)" letter-spacing="2" filter="url(#glow)">
      TELEMETRY
    </text>

    <!-- APEX PRO / OUT Badge -->
    <rect x="480" y="26" width="48" height="26" rx="4" fill="url(#neonLimeGrad)" />
    <text x="488" y="44" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#0c0d12">
      OUT
    </text>
  </g>
</svg>
