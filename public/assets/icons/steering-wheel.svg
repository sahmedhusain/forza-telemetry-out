<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="wheelRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a4459" />
      <stop offset="100%" stop-color="#181c26" />
    </linearGradient>
  </defs>

  <!-- Outer Rim -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#wheelRimGrad)" stroke-width="12" />
  <circle cx="60" cy="60" r="57" fill="none" stroke="#ff0055" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- 12 O'Clock Racing Marker -->
  <rect x="57" y="2" width="6" height="12" fill="#ff0055" rx="1" />

  <!-- Center Hub -->
  <circle cx="60" cy="60" r="18" fill="#151822" stroke="#48546e" stroke-width="2" />
  <circle cx="60" cy="60" r="8" fill="#ff0055" />

  <!-- Spokes -->
  <!-- Left Spoke -->
  <rect x="14" y="55" width="30" height="10" rx="3" fill="#242b3b" />
  <!-- Right Spoke -->
  <rect x="76" y="55" width="30" height="10" rx="3" fill="#242b3b" />
  <!-- Bottom Spoke -->
  <rect x="55" y="76" width="10" height="30" rx="3" fill="#242b3b" />
</svg>
